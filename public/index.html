<!DOCTYPE html>
<!--
  Página pública del portafolio.
  Esta página solo define la estructura (cabecera, contenedores de sección y pie).
  El contenido de cada sección lo pinta /js/portfolio.js a partir de /api/portfolio,
  y los textos fijos se traducen con /js/i18n.js (atributos data-i18n*).
-->
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio | IT Specialist Technician</title>
  <meta name="description" content="Portafolio profesional de TI: experiencia, competencias, formación y contacto.">
  <meta name="theme-color" content="#ffffff">
  <!-- Favicon (logo "JP") e iconos para guardar en la pantalla de inicio -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Tipografías: Geist (texto) y JetBrains Mono (datos/etiquetas), más iconos Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <!-- Tailwind por CDN (el diseño base lo usa) + su configuración compartida -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body class="bg-[#f8fafc] text-graphite-900 selection:bg-brand-100 selection:text-brand-900">

  <!-- ============ Cabecera fija ============ -->
  <header class="sticky top-0 z-40 w-full bg-white/90 backdrop-blur-md border-b border-graphite-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between gap-2 sm:gap-3">
      <!-- Marca: iniciales, nombre, título y estado (se rellenan desde la API) -->
      <a class="flex items-center gap-3 group min-w-0" href="#perfil" data-i18n-aria="header.home">
        <div id="header-initials" class="w-9 h-9 shrink-0 rounded-lg bg-graphite-900 flex items-center justify-center text-white font-mono font-bold text-sm shadow-sm group-hover:bg-brand-600 transition-colors">··</div>
        <div class="flex flex-col min-w-0">
          <div class="flex items-center gap-2 min-w-0">
            <span id="header-name" class="font-bold text-sm tracking-tight text-graphite-900 group-hover:text-brand-600 transition-colors truncate">…</span>
            <span class="text-graphite-300 hidden sm:inline">/</span>
            <span id="header-title" class="hidden sm:inline text-xs font-mono text-graphite-500 uppercase tracking-wider truncate"></span>
          </div>
          <span class="text-[11px] text-emerald-600 font-mono flex items-center gap-1 min-w-0">
            <span class="w-1.5 h-1.5 shrink-0 rounded-full bg-emerald-500"></span>
            <span id="header-availability" class="truncate"></span>
          </span>
        </div>
      </a>

      <!-- Navegación de escritorio -->
      <nav class="hidden lg:flex items-center gap-1 text-sm font-medium text-graphite-600" data-i18n-aria="nav.aria">
        <a class="px-3 py-1.5 rounded-md hover:text-graphite-900 hover:bg-graphite-100 transition-all" href="#perfil" data-i18n="nav.profile">Perfil</a>
        <a class="px-3 py-1.5 rounded-md hover:text-graphite-900 hover:bg-graphite-100 transition-all" href="#experiencia" data-i18n="nav.experience">Experiencia</a>
        <a class="px-3 py-1.5 rounded-md hover:text-graphite-900 hover:bg-graphite-100 transition-all" href="#proyectos" data-i18n="nav.projects" data-projects-link>Proyectos</a>
        <a class="px-3 py-1.5 rounded-md hover:text-graphite-900 hover:bg-graphite-100 transition-all" href="#metricas" data-i18n="nav.highlights">Resumen</a>
        <a class="px-3 py-1.5 rounded-md hover:text-graphite-900 hover:bg-graphite-100 transition-all" href="#contacto" data-i18n="nav.contact">Contacto</a>
      </nav>

      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <!-- Selector de idioma: traduce TODA la página (contenido + interfaz) -->
        <div id="lang-switch" role="group" data-i18n-aria="lang.aria"
             class="inline-flex items-center rounded-lg border border-graphite-200 bg-white p-0.5 font-mono text-xs">
          <button type="button" data-lang="es" data-i18n-title="lang.es"
                  class="lang-btn px-2.5 py-1 rounded-md font-semibold transition-colors">ES</button>
          <button type="button" data-lang="en" data-i18n-title="lang.en"
                  class="lang-btn px-2.5 py-1 rounded-md font-semibold transition-colors">EN</button>
        </div>
        <!-- Descarga del resume en PDF -->
        <a href="/files/Resume_Jonathan_Padilla.pdf" download
           class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-graphite-200 bg-white hover:bg-graphite-50 text-graphite-700 font-mono text-xs transition-colors">
          <span class="material-symbols-outlined text-[16px]">download</span>
          <span data-i18n="header.cv">CV (PDF)</span>
        </a>
        <a href="#contacto" class="hidden min-[480px]:inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs shadow-sm hover:shadow transition-all">
          <span class="material-symbols-outlined text-[16px]">mail</span>
          <span data-i18n="header.contact">Contactar</span>
        </a>
        <a id="open-admin-btn" href="/admin/" data-i18n-aria="header.adminAria" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-graphite-100 hover:bg-brand-50 hover:text-brand-600 border border-graphite-200/80 text-graphite-700 font-mono text-xs font-medium transition-all group">
          <span class="material-symbols-outlined text-[16px] text-graphite-500 group-hover:text-brand-600 group-hover:rotate-45 transition-transform">tune</span>
          <span class="hidden xl:inline" data-i18n="header.admin">Modo Admin</span>
        </a>
        <!-- Botón de menú (solo móvil/tableta) -->
        <button id="menu-btn" type="button" data-i18n-aria="header.menuOpen" aria-expanded="false" aria-controls="mobile-menu" class="lg:hidden inline-flex items-center justify-center w-9 h-9 rounded-lg border border-graphite-200 bg-white hover:bg-graphite-50 text-graphite-700">
          <span id="menu-icon" class="material-symbols-outlined text-[20px]">menu</span>
        </button>
      </div>
    </div>

    <!-- Menú móvil / tableta -->
    <nav id="mobile-menu" class="hidden lg:hidden border-t border-graphite-200 bg-white" data-i18n-aria="nav.ariaMobile">
      <div class="max-w-7xl mx-auto px-4 sm:px-8 py-3 grid grid-cols-2 gap-2 text-sm font-medium text-graphite-700">
        <a class="px-3 py-2.5 rounded-lg bg-graphite-50 hover:bg-graphite-100" href="#perfil" data-i18n="nav.profile">Perfil</a>
        <a class="px-3 py-2.5 rounded-lg bg-graphite-50 hover:bg-graphite-100" href="#experiencia" data-i18n="nav.experience">Experiencia</a>
        <a class="px-3 py-2.5 rounded-lg bg-graphite-50 hover:bg-graphite-100" href="#proyectos" data-i18n="nav.projects" data-projects-link>Proyectos</a>
        <a class="px-3 py-2.5 rounded-lg bg-graphite-50 hover:bg-graphite-100" href="#metricas" data-i18n="nav.highlights">Resumen</a>
        <a class="px-3 py-2.5 rounded-lg bg-graphite-50 hover:bg-graphite-100" href="#contacto" data-i18n="nav.contact">Contacto</a>
        <a class="px-3 py-2.5 rounded-lg bg-graphite-50 hover:bg-graphite-100 font-mono text-xs flex items-center gap-1.5 sm:hidden" href="/admin/">
          <span class="material-symbols-outlined text-[16px]">tune</span> <span data-i18n="header.admin">Modo Admin</span>
        </a>
        <a class="px-3 py-2.5 rounded-lg bg-graphite-50 hover:bg-graphite-100 font-mono text-xs flex items-center gap-1.5 md:hidden" href="/files/Resume_Jonathan_Padilla.pdf" download>
          <span class="material-symbols-outlined text-[16px]">download</span> <span data-i18n="header.cv">CV (PDF)</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- ============ Contenido: cada sección la rellena portfolio.js ============ -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-8 sm:py-12 space-y-12 sm:space-y-16">
    <section id="perfil" data-i18n-aria="profile.aria"><div class="skeleton h-96"></div></section>
    <section id="metricas" class="space-y-6" data-i18n-aria="metrics.aria"><div class="skeleton h-72"></div></section>
    <section id="experiencia" class="space-y-6" data-i18n-aria="experience.aria"><div class="skeleton h-96"></div></section>
    <section id="proyectos" class="space-y-6 scroll-mt-24" data-i18n-aria="projects.aria"></section>
    <section id="formacion" class="grid grid-cols-1 md:grid-cols-2 gap-6" data-i18n-aria="training.aria"></section>
    <section id="contacto" class="bg-white rounded-2xl border border-graphite-200 p-6 sm:p-10 lg:p-12 shadow-sm" data-i18n-aria="contact.aria"></section>
  </main>

  <!-- Vista ampliada de las imágenes y videos de los proyectos -->
  <dialog id="lightbox" class="p-0 m-auto overflow-hidden w-[min(1100px,94vw)] max-h-[92vh] bg-transparent backdrop:bg-graphite-950/85">
    <div class="relative flex flex-col items-center gap-3">
      <button type="button" data-lb="close" data-i18n-aria="projects.close" class="self-end inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div class="relative w-full flex items-center justify-center">
        <button type="button" data-lb="prev" data-i18n-aria="projects.prevImage" class="absolute left-2 z-10 inline-flex items-center justify-center w-11 h-11 rounded-full bg-graphite-950/60 hover:bg-graphite-950/80 text-white shadow-lg">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <div id="lightbox-media" class="w-full flex items-center justify-center"></div>
        <button type="button" data-lb="next" data-i18n-aria="projects.nextImage" class="absolute right-2 z-10 inline-flex items-center justify-center w-11 h-11 rounded-full bg-graphite-950/60 hover:bg-graphite-950/80 text-white shadow-lg">
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>
      <p id="lightbox-caption" class="text-sm text-white/80 font-mono text-center"></p>
    </div>
  </dialog>

  <!-- ============ Pie de página ============ -->
  <footer class="w-full bg-white border-t border-graphite-200 py-8 mt-16 text-xs text-graphite-500 font-mono">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
      <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2">
        <span id="footer-brand" class="font-bold text-graphite-900"></span>
        <span class="text-graphite-300">/</span>
        <span id="footer-tagline"></span>
      </div>
      <a href="/admin/" class="text-brand-600 hover:underline" data-i18n="footer.admin">Panel Admin</a>
    </div>
  </footer>

  <!-- i18n debe cargarse antes que portfolio.js (que lo usa) -->
  <script src="/js/i18n.js"></script>
  <script src="/js/portfolio.js"></script>
</body>
</html>
